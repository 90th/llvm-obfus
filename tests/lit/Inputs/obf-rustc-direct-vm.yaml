frontend: rust
seed: 31337
default_level: none
targets:
  - match: rust_direct_target
    level: strong
  - match: rust_direct_vm_target
    level: vm
overrides:
  - name: rust_direct_vm_override
    level: vm
string_encoding:
  authenticated_mode: true
  prefer_lazy_decode: true
  allow_ctor_fallback: false
security:
  strip_release_markers: true
  fail_on_public_obf_symbol: true
